semantic_3d_fusion:
  ros__parameters:
    topics:
      lidar: /lidar/points/processed
      class_map: /semantic/class_map
      confidence_map: /semantic/confidence_map
      camera_info: /stereo/frame_left/camera_info
      semantic_cloud: /semantic_3d/points
      unassigned_cloud: /semantic_3d/unassigned_points

    camera:
      # When true, width/height/fx/fy/cx/cy are read from CameraInfo.
      use_camera_info: true
      width: 0
      height: 0
      fx: 0.0
      fy: 0.0
      cx: 0.0
      cy: 0.0

    frames:
      # Optional fallback frame names when the PointCloud2 header is empty.
      lidar: ""
      camera: ""

    extrinsic:
      # false = use the manually configured LiDAR->camera transform below.
      # true  = lookup T_camera_lidar from TF at the LiDAR timestamp.
      use_tf: false
      lidar_frame: ""
      camera_frame: ""
      translation:
        x: 0.0
        y: 0.0
        z: 0.0
      rotation:
        roll: 0.0
        pitch: 0.0
        yaw: 0.0

    fusion:
      min_depth: 0.10
      max_depth: 50.0
      min_confidence: 0.25
      invalid_class_id: -1
      keep_unknown: true

      # Phase 5 publishes flattened 2D maps. Nearest-neighbour is the default.
      nearest_pixel: true
      use_bilinear: false

      # If > 0, search a square pixel neighborhood and choose the highest confidence.
      # nearest_pixel should be false for this mode.
      pixel_radius: 0

      # If true, class and confidence arrays must both match W*H.
      require_matching_map_sizes: true
